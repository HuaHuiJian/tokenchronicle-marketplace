name: public-boundary

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Reject private implementation and user-data file types
        run: |
          blocked="$(find . -path ./.git -prune -o -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.js' -o -name '*.ts' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.jsonl' \) -print)"
          test -z "$blocked" || { printf '%s\n' "$blocked"; exit 1; }
      - name: Reject private paths and credential markers
        run: |
          ! grep -RIE --exclude-dir=.git --exclude='public-boundary.yml' '(/Users/[^/[:space:]]+/|/home/[^/[:space:]]+/|ADMIN_TOKEN[[:space:]]*=|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' .
      - name: Validate marketplace shape
        run: |
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path

          root = Path(".")
          data = json.loads((root / ".agents/plugins/marketplace.json").read_text())
          assert data["name"] == "tokenchronicle"
          assert isinstance(data["plugins"], list)
          required_targets = {
              "macos-arm64": ("tokenchronicle", "developer-id-notarized"),
              "macos-x86_64": ("tokenchronicle", "developer-id-notarized"),
              "windows-x86_64": ("tokenchronicle.exe", "authenticode-signed"),
          }
          for plugin in data["plugins"]:
              assert plugin.get("name") == "tokenchronicle"
              source = plugin.get("source")
              assert isinstance(source, dict) and source.get("source") == "local"
              source_path = source.get("path")
              assert isinstance(source_path, str) and source_path.startswith("./plugins/")
              manifest = root / source_path / ".codex-plugin/plugin.json"
              assert manifest.is_file(), manifest
              metadata = json.loads(manifest.read_text())
              assert metadata.get("name") == "tokenchronicle"
              assert plugin.get("category")
              policy = plugin.get("policy")
              assert policy and policy.get("installation") in {
                  "NOT_AVAILABLE", "AVAILABLE", "INSTALLED_BY_DEFAULT"
              }
              assert policy.get("authentication") in {"ON_INSTALL", "ON_USE"}
              if policy["installation"] == "NOT_AVAILABLE":
                  continue
              for target, (executable_name, signature_state) in required_targets.items():
                  target_root = root / source_path / "bin" / target
                  executable = target_root / executable_name
                  signed_manifest = target_root / "STANDALONE_MANIFEST.json"
                  assert executable.is_file(), executable
                  assert signed_manifest.is_file(), signed_manifest
                  signed = json.loads(signed_manifest.read_text())
                  assert signed.get("target") == target
                  assert signed.get("executable") == executable_name
                  assert signed.get("signature_state") == signature_state
                  assert signed.get("signing_identity")
                  if target.startswith("macos-"):
                      assert signed.get("notarization_id")
                  digest = hashlib.sha256(executable.read_bytes()).hexdigest()
                  assert digest == signed.get("executable_sha256")

              release_manifest = root / "PUBLIC_RELEASE_MANIFEST.json"
              assert release_manifest.is_file(), release_manifest
              release = json.loads(release_manifest.read_text())
              assert release.get("contains_private_source") is False
              assert release.get("contains_user_data") is False
              assert release.get("contains_credentials") is False
          PY
